<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFlow · Entrar</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-wrap">
      <header class="login-brand">
        <span class="brand-mark">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <path
              d="M4 18h6l3-8 5 16 3-8h11"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <div>
          <strong>MedFlow</strong>
          <small>Cuidando de cada vida</small>
        </div>
      </header>
      <h1 id="auth-titulo">Bem-Vindo de Volta!</h1>
      <form id="login" class="login-form">
        <div id="campo-email">
          <label for="email">E-mail</label
          ><input
            id="email"
            type="email"
            required
            autocomplete="username"
            maxlength="254"
          />
        </div>
        <div id="campo-senha">
          <label for="senha">Senha</label
          ><input
            id="senha"
            type="password"
            required
            autocomplete="current-password"
            maxlength="128"
          />
        </div>
        <p id="login-erro" class="erro" role="alert"></p>
        <p id="login-mensagem" role="status"></p>
        <button id="auth-enviar" class="primary" type="submit">Entrar</button>
      </form>
    </main>
    <script src="js/sessao.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
